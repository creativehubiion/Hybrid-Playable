<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hybrid Poll (simple) – TEMPLATE</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* ══════════════════════════════════════════════════════════════
       EDIT ME ▸ THEME  (identical system to index.html)
       Change --accent + the surface/text colours; every tint follows.
       ══════════════════════════════════════════════════════════════ */
    :root {
      --accent: #1f7fd2;
      --accent-light: #f15a24;

      --bg: #f6fbff;
      --bg-card: #ffffff;
      --bg-option: #ffffff;
      --bg-option-hover: #eef7ff;
      --badge-bg: #1f7fd2;
      --badge-text: #ffffff;

      --text: #081d49;
      --text-muted: #536176;

      --video-bg: #000;
      --success: #f15a24;

      /* ── Derived tints (leave as-is; they follow --accent) ── */
      --accent-glow: color-mix(in srgb, var(--accent) 30%, transparent);
      --accent-soft: color-mix(in srgb, var(--accent) 15%, transparent);
      --accent-softer: color-mix(in srgb, var(--accent) 12%, transparent);
      --accent-cta: #f15a24;
      --border: #b9c8da;
      --border-hover: #1f7fd2;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #000;
      color: var(--text);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      /* 2:3 ad frame — fills the viewport by whichever dimension is limiting, keeping ratio.
         Black letterbox (body bg) fills the rest. */
      aspect-ratio: 2 / 3;
      width: min(100vw, calc(100dvh * 2 / 3));
      height: auto;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── VIDEO AREA (37%) — autoplays muted on load ── */
    .video-area {
      height: 37%;
      position: relative;
      background: var(--video-bg);
      overflow: hidden;
      flex-shrink: 0;
    }

    .video-label {
      position: absolute;
      top: clamp(6px, 1.5vw, 14px);
      left: clamp(6px, 1.5vw, 14px);
      background: var(--accent);
      color: #fff;
      font-size: clamp(8px, 2vw, 14px);
      font-weight: 600;
      padding: clamp(2px, 0.5vw, 5px) clamp(6px, 1.5vw, 12px);
      border-radius: clamp(3px, 0.8vw, 6px);
      z-index: 2;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      opacity: 0;
    }

    .video-area video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .mute-btn {
      position: absolute;
      top: clamp(8px, 2vw, 14px);
      right: clamp(8px, 2vw, 14px);
      width: clamp(28px, 7vw, 40px);
      height: clamp(28px, 7vw, 40px);
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      color: #fff;
      cursor: pointer;
      z-index: 3;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    .mute-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .mute-btn svg {
      width: clamp(14px, 3.5vw, 20px);
      height: clamp(14px, 3.5vw, 20px);
      fill: #fff;
    }

    /* ── POLL AREA (63%) — visible immediately ── */
    .poll-area {
      height: 63%;
      display: flex;
      flex-direction: column;
      padding: clamp(6px, 1.5vw, 20px) clamp(12px, 4vw, 40px);
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg) 100%);
      overflow: hidden;
      position: relative;
    }

    .poll-content {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .poll-header {
      text-align: center;
      margin-bottom: clamp(4px, 1.5vw, 16px);
      flex-shrink: 0;
    }

    .poll-header h2 {
      font-size: clamp(14px, 4vw, 32px);
      font-weight: 700;
      margin-bottom: clamp(3px, 0.8vw, 8px);
      background: var(--success);
      /* linear-gradient(135deg, var(--accent-light), var(--text)); */
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .poll-header p {
      font-size: clamp(10px, 2.5vw, 18px);
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 90%;
      margin: 0 auto;
    }

    .poll-options {
      display: flex;
      flex-direction: column;
      gap: clamp(4px, 1vw, 10px);
    }

    .poll-option {
      position: relative;
      display: flex;
      align-items: center;
      gap: clamp(6px, 1.5vw, 14px);
      padding: clamp(6px, 1.5vw, 14px) clamp(10px, 2.5vw, 20px);
      background: var(--bg-option);
      border: 1.5px solid var(--border);
      border-radius: clamp(6px, 1.5vw, 12px);
      cursor: pointer;
      transition: all 0.2s ease;
      overflow: hidden;
    }

    .poll-option:hover {
      background: var(--bg-option-hover);
      border-color: var(--border-hover);
    }

    .poll-option.selected {
      background: var(--accent-soft);
      border-color: var(--accent);
      box-shadow: 0 0 clamp(8px, 2vw, 20px) var(--accent-glow);
    }

    .poll-option .number {
      width: clamp(24px, 6vw, 40px);
      height: clamp(24px, 6vw, 40px);
      border-radius: 50%;
      background: var(--badge-bg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      font-size: clamp(11px, 2.8vw, 20px);
      color: var(--badge-text);
      flex-shrink: 0;
      transition: all 0.2s;
      z-index: 1;
    }

    .poll-option.selected .number {
      background: var(--accent);
      color: #fff;
    }

    .poll-option .label {
      font-size: clamp(11px, 2.8vw, 20px);
      font-weight: 500;
      z-index: 1;
      flex: 1;
    }

    .poll-option .check {
      width: clamp(16px, 4vw, 28px);
      height: clamp(16px, 4vw, 28px);
      opacity: 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
      z-index: 1;
    }

    .poll-option.selected .check {
      opacity: 1;
    }

    .poll-option .result-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0;
      background: var(--accent-softer);
      transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: clamp(6px, 1.5vw, 12px);
    }

    .poll-option .result-pct {
      font-size: clamp(10px, 2.2vw, 16px);
      font-weight: 700;
      color: var(--accent-light);
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 1;
      flex-shrink: 0;
    }

    .poll-option.voted .result-pct {
      opacity: 1;
    }

    .poll-option.voted {
      cursor: default;
      pointer-events: none;
    }

    .submit-btn {
      margin-top: clamp(6px, 1.5vw, 14px);
      padding: clamp(10px, 2.5vw, 18px);
      border: none;
      border-radius: clamp(6px, 1.5vw, 12px);
      background: var(--accent-cta);
      color: #fff;
      font-family: inherit;
      font-size: clamp(12px, 3vw, 20px);
      font-weight: 700;
      cursor: not-allowed;
      transition: all 0.3s;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .submit-btn.active {
      background: var(--accent-cta);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 clamp(2px, 0.5vw, 6px) clamp(12px, 3vw, 30px) var(--accent-glow);
    }

    .submit-btn.active:hover {
      background: #e94a18;
      transform: translateY(-1px);
    }

    .submit-btn.submitted {
      background: var(--success);
      color: #fff;
      cursor: default;
      pointer-events: none;
    }

    .powered-by {
      text-align: center;
      padding-top: clamp(6px, 1.5vw, 12px);
      font-size: clamp(8px, 1.8vw, 13px);
      color: var(--text-muted);
      letter-spacing: 0.8px;
      text-transform: uppercase;
      opacity: 0.5;
      flex-shrink: 0;
    }

    .logo-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: clamp(8px, 2vw, 16px);
      padding-bottom: clamp(4px, 1vw, 8px);
      flex-shrink: 0;
    }

    .logo-footer img {
      width: clamp(130px, 55%, 240px);
      height: auto;
      object-fit: contain;
      opacity: 0.97;
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- VIDEO — autoplays muted, loops -->
    <div class="video-area">
      <div class="video-label"></div>
      <video id="video" autoplay muted loop playsinline preload="auto"></video>
      <button class="mute-btn" id="muteBtn" onclick="toggleMute()">
        <svg id="muteIcon" viewBox="0 0 24 24">
          <path
            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
        <svg id="unmuteIcon" viewBox="0 0 24 24" style="display:none">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
      </button>
    </div>

    <!-- POLL — shown immediately -->
    <div class="poll-area">
      <div class="poll-content">
        <div class="poll-header">
          <h2></h2>
          <p></p>
        </div>

        <div class="poll-options" id="pollOptions"></div>

        <button class="submit-btn" id="submitBtn" onclick="submitVote()"></button>
        <div class="powered-by"></div>
        <div class="logo-footer">
          <img src="logo.png" alt="Logo" />
        </div>
      </div>
    </div>

  </div>

  <script>
    /* ══════════════════════════════════════════════════════════════
       EDIT ME ▸ COPY & DATA
       ══════════════════════════════════════════════════════════════ */
    const CONFIG = {
      videoSrc: 'video.mp4',       // clip in THIS folder
      videoLabel: 'Live Clip',     // small pill top-left (hidden by default)

      pollTitle: 'Which issue matters most to you right now?',
      pollPrompt: 'Share your top priority:',
      // TIP: use "double quotes" for any label containing an apostrophe (e.g. "I'm")
      options: [
        { label: "Healthcare", result: 30 },
        { label: "Education", result: 22 },
        { label: "The Economy", result: 24 },
        { label: "Public Safety", result: 14 },
        { label: "Veterans", result: 10 },
      ],
      submitLabel: 'Submit Vote',
      submitThanks: 'Thank You!',

      brandLine: '',   // optional line at the very bottom
    };

    /* ── Wiring (you shouldn't need to edit below) ── */
    const $ = (s) => document.querySelector(s);
    const check = () =>
      '<svg viewBox="0 0 24 24"><polyline points="4,12 10,18 20,6" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';

    const video = document.getElementById('video');
    video.src = CONFIG.videoSrc;
    $('.video-label').textContent = CONFIG.videoLabel;
    $('.poll-header h2').textContent = CONFIG.pollTitle;
    $('.poll-header p').textContent = CONFIG.pollPrompt;
    $('.powered-by').textContent = CONFIG.brandLine;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.textContent = CONFIG.submitLabel;

    document.getElementById('pollOptions').innerHTML = CONFIG.options.map((o, i) => `
      <div class="poll-option" data-value="${i + 1}" onclick="selectOption(this)">
        <div class="number">${i + 1}</div>
        <div class="label">${o.label}</div>
        <div class="result-pct"></div>
        <div class="check">${check()}</div>
        <div class="result-bar"></div>
      </div>`).join('');

    // Mute toggle
    const muteIcon = document.getElementById('muteIcon');
    const unmuteIcon = document.getElementById('unmuteIcon');
    function toggleMute() {
      video.muted = !video.muted;
      muteIcon.style.display = video.muted ? 'block' : 'none';
      unmuteIcon.style.display = video.muted ? 'none' : 'block';
    }

    // Selection + submit
    let selectedOption = null;
    function selectOption(el) {
      if (submitBtn.classList.contains('submitted')) return;
      document.querySelectorAll('.poll-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
      selectedOption = el.dataset.value;
      submitBtn.classList.add('active');
    }

    function submitVote() {
      if (!selectedOption || submitBtn.classList.contains('submitted')) return;
      submitBtn.textContent = CONFIG.submitThanks;
      submitBtn.classList.remove('active');
      submitBtn.classList.add('submitted');
      document.querySelectorAll('.poll-option').forEach((opt, i) => {
        const pct = CONFIG.options[i].result;
        opt.querySelector('.result-bar').style.width = pct + '%';
        opt.querySelector('.result-pct').textContent = pct + '%';
        opt.classList.add('voted');
      });
    }
  </script>
</body>

</html>
